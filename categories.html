<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Vault — LockDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>

<body>
  <div class="app">

    <header class="app-header">
      <button class="back-btn" data-back="index.html" aria-label="Back"><span class="i" id="back-icon"></span></button>
      <h1>Document Vault Categories</h1>
    </header>

    <main class="app-main">
      <div class="stack">

        <!-- Category Chips -->
        <div class="row overflow-x-auto items-start gap-8" id="category-chips" style="padding-bottom:4px;"></div>

        <!-- Folder QR Entry Button -->
        <button class="btn btn-outline" id="folder-qr-btn"
          style="display:none;border-color:var(--primary);color:var(--primary);">Show QR for this Folder</button>

        <!-- Document List -->
        <div class="stack" id="doc-list"></div>

        <!-- Requester Mode Actions -->
        <div id="requester-actions" class="card stack"
          style="display:none;background:#F0F9FF;border:1px solid #BAE6FD;">
          <p class="text-muted text-sm font-semibold" style="color:var(--cyan);">Select a document category above, then
            specify your purpose below:</p>
          <div class="field">
            <label for="request-purpose">Purpose of Access Request</label>
            <textarea id="request-purpose" placeholder="e.g. Verifying identity for employment verification"></textarea>
          </div>
          <button class="btn btn-primary" id="request-doc-btn" disabled>Submit Document Request</button>
        </div>

      </div>
    </main>

    <div id="bottom-nav-slot" data-active="categories"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/blockchain.js"></script>
  <script src="js/app.js"></script>
  <script src="js/emailjs.js"></script>
  <script src="js/connection.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      document.getElementById('back-icon').innerHTML = LD.icons.back;

      var currentUser = LD.data.currentUser();
      var categories = LD.data.categories();
      var params = new URLSearchParams(window.location.search);
      var activeCat = params.get('cat') || 'all';
      var sessionId = params.get('session');
      var activeSession = sessionId ? LD.data.getActiveSession(sessionId) : null;

      // If not in requester session mode, preserve full Royal Dashboard!
      if (!sessionId && !activeSession) {
        window.location.href = 'index.html?cat=' + encodeURIComponent(activeCat);
        return;
      }

      if (!activeSession && sessionId && LD.data.isJwtAuthenticated()) {
        try {
          var response = await LD.api.getConnectionSession(sessionId);
          if (response && response.success && response.session) {
            activeSession = response.session;
            LD.data.addActiveSession(activeSession);
          }
        } catch (err) {
          console.error('Failed to load session from backend:', err);
        }
      }
      var isRequesterMode = !!activeSession;

      if (isRequesterMode) {
        document.getElementById('requester-actions').style.display = 'flex';
      }

      var selectedDocId = null;

      function renderChips() {
        var all = [{ id: 'all', name: 'All', color: 'blue' }].concat(categories);
        document.getElementById('category-chips').innerHTML = all.map(function (c) {
          var isActive = c.id === activeCat;
          return '<button class="badge ' + (isActive ? 'badge-primary' : 'badge-neutral') + '" style="padding:10px 16px;font-size:13px;white-space:nowrap;flex-shrink:0;margin-right:8px;border:none;cursor:pointer;" data-cat="' + c.id + '">' + c.name + '</button>';
        }).join('');

        document.querySelectorAll('[data-cat]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            activeCat = btn.getAttribute('data-cat');
            renderChips();
            renderDocs();
            renderFolderQrButton();
          });
        });
      }

      function renderFolderQrButton() {
        var btn = document.getElementById('folder-qr-btn');
        if (isRequesterMode || activeCat === 'all') {
          btn.style.display = 'none';
          return;
        }
        var cat = categories.find(function (c) { return c.id === activeCat; });
        btn.style.display = 'block';
        btn.textContent = 'Show QR Code for "' + (cat ? cat.name : activeCat) + '"';
        btn.onclick = function () {
          window.location.href = 'qr.html?cat=' + encodeURIComponent(activeCat);
        };
      }

      function renderDocs() {
        var docs = activeCat === 'all' ? LD.data.documents() : LD.data.documentsByCategory(activeCat);
        var list = document.getElementById('doc-list');

        if (docs.length === 0) {
          list.innerHTML = '<div class="empty-state"><div class="icon">' + LD.icons.folder + '</div><p class="text-sm font-semibold">No documents in this category</p></div>';
          return;
        }

        if (isRequesterMode) {
          list.innerHTML = docs.map(function (d) {
            var cat = categories.find(function (c) { return c.id === d.category; }) || { color: 'blue', name: 'Documents' };
            return '<label class="checkbox-row" data-doc-id="' + d.id + '">' +
              '<input type="radio" name="request-doc" value="' + d.id + '">' +
              '<div class="icon-tile ' + cat.color + '" style="width:40px;height:40px;">' + LD.icons[LD.ui.categoryIcon(d.category)] + '</div>' +
              '<div style="flex:1;"><p class="font-bold text-15">' + cat.name + ' Document</p><p class="text-muted text-xs">Issued by ' + d.issuer + '</p></div>' +
              (d.verified ? '<span class="badge badge-success"><span class="badge-dot"></span> Verified</span>' : '') +
              '</label>';
          }).join('');

          list.querySelectorAll('.checkbox-row').forEach(function (row) {
            row.addEventListener('click', function () {
              row.querySelector('input').checked = true;
              list.querySelectorAll('.checkbox-row').forEach(function (r) { r.classList.remove('checked'); });
              row.classList.add('checked');
              selectedDocId = row.getAttribute('data-doc-id');
              document.getElementById('request-doc-btn').disabled = false;
            });
          });
        } else {
          list.innerHTML = docs.map(function (d) {
            var cat = categories.find(function (c) { return c.id === d.category; }) || { color: 'blue' };
            return '<div class="list-row">' +
              '<div class="icon-tile ' + cat.color + '">' + LD.icons[LD.ui.categoryIcon(d.category)] + '</div>' +
              '<div style="flex:1;min-width:0;">' +
              '<p class="font-bold text-15" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + d.name + '</p>' +
              '<p class="text-muted text-xs">Issuer: ' + d.issuer + '</p>' +
              '</div>' +
              (d.verified ? '<span class="badge badge-success"><span class="badge-dot"></span> Verified</span>' : '') +
              '</div>';
          }).join('');
        }
      }

      document.getElementById('request-doc-btn').addEventListener('click', async function () {
        if (!selectedDocId || !sessionId) {
          LD.ui.toast('Please select a document', 'error');
          return;
        }
        var purpose = document.getElementById('request-purpose').value.trim() || 'Verification';

        document.getElementById('request-doc-btn').disabled = true;
        document.getElementById('request-doc-btn').textContent = 'Submitting Request...';

        var requests = await LD.request.submit(sessionId);
        if (requests && requests.length) {
          LD.ui.toast('Document request sent for PIN approval!', 'success');
          LD.data.addAuditLog('document_requested', 'Document requested', purpose + ' - ' + selectedDocId);
          document.getElementById('request-doc-btn').textContent = 'Request Sent! Waiting for Approval...';
        } else {
          LD.ui.toast('Failed to send document request', 'error');
          document.getElementById('request-doc-btn').disabled = false;
          document.getElementById('request-doc-btn').textContent = 'Submit Document Request';
        }
      });

      function renderAll() {
        renderChips();
        renderDocs();
        renderFolderQrButton();
      }

      window.addEventListener('ld-vault-documents-loaded', renderAll);
      renderAll();
    });
  </script>
</body>

</html>
