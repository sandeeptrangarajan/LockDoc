<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Document Viewer — LockDoc</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: #090D16;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      color: #F9FAFB;
      overflow-x: hidden;
    }

    /* ── Top Bar ── */
    .viewer-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 16, 28, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.15);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .viewer-meta-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .doc-icon-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .doc-titles {
      min-width: 0;
    }

    .doc-titles h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-titles p {
      margin: 2px 0 0;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.5);
    }

    .viewer-controls-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    #viewer-countdown {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      font-weight: 700;
      color: #00F0FF;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
    }

    #viewer-countdown.warn {
      color: #F43F5E;
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.4);
    }

    .btn-open-full {
      font-size: 12px;
      font-weight: 700;
      color: #00F0FF;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.2s ease;
    }
    .btn-open-full:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: #00F0FF;
    }

    /* ── Main Document Viewport ── */
    .viewer-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: calc(100vh - 65px);
      background: #0B0F19;
      position: relative;
    }

    #viewer-doc-area {
      width: 100%;
      height: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .doc-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #111827;
    }

    .doc-image-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
      background: #060B14;
    }

    .doc-image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.8);
    }

    /* ── States ── */
    #viewer-loading, #viewer-denied {
      padding: 60px 20px;
      text-align: center;
      margin: auto;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(0,240,255,0.15);
      border-top-color: #00F0FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #viewer-denied { display: none; }
  </style>
</head>

<body>
  <!-- Top bar -->
  <div class="viewer-topbar" id="viewer-topbar">
    <div class="viewer-meta-left">
      <div class="doc-icon-badge" id="doc-icon">📄</div>
      <div class="doc-titles">
        <h1 id="viewer-doc-name">Loading Document…</h1>
        <p id="viewer-subtitle">Verified Secure Stream</p>
      </div>
    </div>
    <div class="viewer-controls-right">
      <span id="viewer-countdown">⏱ 60s</span>
      <a href="#" id="viewer-direct-btn" target="_blank" rel="noopener" class="btn-open-full" style="display:none;">Open Full ↗</a>
    </div>
  </div>

  <!-- Loading State -->
  <div id="viewer-loading">
    <div class="spinner"></div>
    <p style="font-weight:700;font-size:15px;color:#F9FAFB;">Loading Approved Document…</p>
    <p style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:4px;">Connecting to vault</p>
  </div>

  <!-- Denied State -->
  <div id="viewer-denied">
    <div style="font-size:52px;margin-bottom:12px;">🔒</div>
    <h3 style="font-size:18px;margin:0 0 8px;color:#F9FAFB;">Access Restricted</h3>
    <p id="viewer-denied-msg" style="color:rgba(255,255,255,0.5);font-size:14px;margin:0;">The access token is invalid or has expired.</p>
    <a href="scan.html" class="btn-open-full" style="display:inline-block;margin-top:16px;">Scan Vault Again</a>
  </div>

  <!-- Main Viewport -->
  <div class="viewer-viewport" id="viewer-active" style="display:none;">
    <div id="viewer-doc-area"></div>
  </div>

  <script src="script.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
