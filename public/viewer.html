<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Secure Document Viewer — LockDoc</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    /* ══════════════════════════════════════════════
       Viewer Page — Full Dark Cyber-Vault Theme
       ══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: #060B14;
      min-height: 100vh;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
    }

    .viewer-page {
      width: 100%;
      max-width: 820px;
      padding: 0 0 48px;
    }

    /* ── Top bar ── */
    .viewer-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(6,11,20,0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,240,255,0.12);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .viewer-topbar-logo {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(0,240,255,0.25), rgba(139,92,246,0.25));
      border: 1px solid rgba(0,240,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .viewer-topbar-info { flex: 1; min-width: 0; }
    .viewer-topbar-info h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #F9FAFB;
      letter-spacing: -0.01em;
    }
    .viewer-topbar-info p {
      margin: 2px 0 0;
      font-size: 11.5px;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .viewer-topbar-badge {
      flex-shrink: 0;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.35);
      color: #10B981;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* ── App body ── */
    .viewer-body { padding: 20px 16px; }

    /* ── Loading state ── */
    .viewer-loading-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px;
      padding: 48px 24px;
      text-align: center;
      color: rgba(255,255,255,0.5);
    }
    .viewer-spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(0,240,255,0.15);
      border-top-color: #00F0FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .viewer-loading-card p { margin: 0; font-size: 14px; font-weight: 600; }

    /* ── Denied state ── */
    .viewer-denied-card {
      background: rgba(244,63,94,0.08);
      border: 1px solid rgba(244,63,94,0.25);
      border-radius: 18px;
      padding: 48px 24px;
      text-align: center;
      display: none;
    }
    .viewer-denied-card h3 { color: #F9FAFB; font-size: 18px; margin: 16px 0 8px; }
    .viewer-denied-card p  { color: rgba(255,255,255,0.5); font-size: 14px; margin: 0; }
    .viewer-back-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 22px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      color: #F9FAFB;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    /* ── Active viewer panel ── */
    #viewer-active { display: none; }

    /* Countdown */
    .viewer-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    #viewer-countdown {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,240,255,0.1);
      border: 1px solid rgba(0,240,255,0.3);
      color: #00F0FF;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 16px;
      border-radius: 999px;
      box-shadow: 0 0 16px rgba(0,240,255,0.15);
      transition: all 0.3s ease;
    }
    #viewer-countdown.warn {
      background: rgba(244,63,94,0.15);
      border-color: rgba(244,63,94,0.45);
      color: #F43F5E;
      box-shadow: 0 0 16px rgba(244,63,94,0.25);
    }
    .viewer-hud-label {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
    }

    /* Document shell */
    .viewer-shell {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #0D1322;
      border: 1px solid rgba(0,240,255,0.18);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,240,255,0.06);
      min-height: 420px;
    }
    /* Holographic grid overlay */
    .viewer-shell::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,240,255,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,0.022) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 2;
    }

    /* Diagonal watermark */
    .viewer-watermark {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.13;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      transform: rotate(-25deg) scale(1.5) translateY(-10%);
      transform-origin: center;
    }
    .viewer-watermark span {
      display: inline-block;
      font-size: 11px;
      font-weight: 900;
      color: #00F0FF;
      white-space: nowrap;
      padding: 7px 20px;
      letter-spacing: 0.05em;
    }

    /* Document content area — file or credential card goes here */
    #viewer-doc-area {
      position: relative;
      z-index: 5;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    /* ── Credential card ── */
    .cred-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .cred-header {
      display: flex;
      align-items: center;
      gap: 13px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .cred-icon {
      width: 48px; height: 48px;
      border-radius: 13px;
      border: 1px solid;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .cred-header-text { flex: 1; min-width: 0; }
    .cred-type {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 3px;
    }
    .cred-issuer {
      font-size: 12.5px;
      color: rgba(255,255,255,0.5);
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cred-badge {
      flex-shrink: 0;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.35);
      color: #10B981;
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .cred-doc-name {
      font-size: 20px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .cred-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 16px;
    }
    @media (max-width: 500px) { .cred-grid { grid-template-columns: 1fr; } }
    .cred-field { display: flex; flex-direction: column; gap: 3px; }
    .cred-field-full { grid-column: 1 / -1; }
    .cred-label {
      font-size: 9.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.3);
    }
    .cred-val {
      font-size: 14px;
      font-weight: 700;
      color: #F3F4F6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cred-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: #00F0FF;
      white-space: normal;
      word-break: break-all;
    }
    .cred-security {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 800;
      color: #10B981;
    }
    .cred-chip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cred-chip {
      width: 48px; height: 34px;
      border-radius: 7px;
      background: linear-gradient(135deg, #FDE68A 0%, #D4AF37 50%, #92400E 100%);
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 3px 10px rgba(212,175,55,0.3);
      position: relative;
    }
    .cred-chip::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(0,0,0,0.25);
      border-radius: 3px;
    }
    .cred-hologram {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 5px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(0,240,255,0.18), rgba(139,92,246,0.18));
      border: 1px solid rgba(0,240,255,0.3);
      color: #E0E7FF;
    }

    /* ── Bottom meta card ── */
    .viewer-meta-card {
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 14px 18px;
      margin-top: 14px;
    }
    .viewer-meta-card .doc-name {
      font-size: 14px;
      font-weight: 800;
      color: #F9FAFB;
    }
    .viewer-meta-card .doc-meta {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
    }
  </style>
</head>

<body oncontextmenu="return false;">
  <div class="viewer-page">

    <!-- Top bar -->
    <div class="viewer-topbar">
      <div class="viewer-topbar-logo">🔒</div>
      <div class="viewer-topbar-info">
        <h1>Secure Document Viewer</h1>
        <p id="viewer-subtitle">Validating access…</p>
      </div>
      <div class="viewer-topbar-badge">🛡 Read Only</div>
    </div>

    <div class="viewer-body">

      <!-- Loading state -->
      <div id="viewer-loading" class="viewer-loading-card">
        <div class="viewer-spinner"></div>
        <p>Validating access credentials…</p>
        <p style="font-size:12px;margin-top:6px;color:rgba(255,255,255,.3);">Connecting to secure vault</p>
      </div>

      <!-- Denied state -->
      <div id="viewer-denied" class="viewer-denied-card">
        <div style="font-size:52px;">🔐</div>
        <h3>Access Denied</h3>
        <p id="viewer-denied-msg">This link is invalid, has expired, or has already been used.</p>
        <a href="dashboard.html" class="viewer-back-btn">← Back to Dashboard</a>
      </div>

      <!-- Active viewer -->
      <div id="viewer-active">

        <!-- HUD row -->
        <div class="viewer-hud">
          <div id="viewer-countdown">⏱ Closing in 60s</div>
          <div class="viewer-hud-label">Watermarked · Read Only</div>
        </div>

        <!-- Document shell -->
        <div class="viewer-shell">
          <div class="viewer-watermark" id="viewer-watermark"></div>
          <!-- File or credential card is injected here by viewer.js -->
          <div id="viewer-doc-area"></div>
        </div>

        <!-- Document metadata -->
        <div class="viewer-meta-card">
          <div class="doc-name" id="viewer-doc-name"></div>
          <div class="doc-meta" id="viewer-meta"></div>
          <div id="viewer-receipt-notice"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
