<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Viewing Document — LockDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { align-items: stretch; }
    .app-container { max-width: 760px; }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="app-container">
    <div class="app-header" style="padding:20px 24px;">
      <h1 style="font-size:18px;color:#fff;">🔒 Secure Document Viewer</h1>
      <p style="font-size:12px;opacity:.7;color:#fff;" id="viewer-subtitle">Loading…</p>
    </div>

    <div class="app-content">
      <div id="viewer-loading" class="dashboard-card" style="text-align:center;">
        <div class="spinner dark" style="margin:0 auto 12px;"></div>
        <p class="text-muted text-sm">Validating access…</p>
      </div>

      <div id="viewer-denied" class="dashboard-card" style="display:none; text-align:center;">
        <h3>Access denied</h3>
        <p class="text-muted text-sm mt-8">This link is invalid, has expired, or was already used.</p>
        <a href="dashboard.html" class="btn btn-secondary mt-16" style="width:auto;padding:8px 16px;">Back to Dashboard</a>
      </div>

      <div id="viewer-active" style="display:none;">
        <div class="viewer-countdown" id="viewer-countdown">60</div>
        <div class="viewer-shell mt-8">
          <div class="viewer-watermark" id="viewer-watermark"></div>
          <iframe id="viewer-frame" class="viewer-frame"></iframe>
        </div>
        <div class="dashboard-card mt-16">
          <p class="text-muted text-sm"><strong id="viewer-doc-name"></strong></p>
          <p class="text-faint text-xs mt-8" id="viewer-meta"></p>
          <div id="viewer-receipt-notice"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
