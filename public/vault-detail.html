<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Folder — LockDoc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <div class="app-header" style="padding:24px 28px;">
      <h1 style="font-size:20px;color:#fff;">🔐 <span id="vd-vault-name">Folder</span></h1>
      <p style="font-size:12px;opacity:.7;color:#fff;" id="vd-vault-category">—</p>
    </div>

    <div class="app-content">
      <div class="row-between" style="margin-bottom:16px;">
        <a href="vault.html" class="btn btn-secondary btn-sm" style="width:auto;padding:8px 16px;">← Back to Vaults</a>
      </div>

      <div class="dashboard-card" style="text-align:center;">
        <h3>Folder QR Code</h3>
        <p class="text-muted text-sm mt-8">Anyone who scans this can request access to documents in this folder. You approve or deny every request.</p>
        <div class="qr-box" id="vd-qr-box">
          <div class="spinner dark"></div>
        </div>
        <button class="btn btn-outline btn-sm" id="vd-regenerate-btn" style="width:auto;padding:8px 16px;">Regenerate QR</button>
      </div>

      <div class="dashboard-card mt-16">
        <div class="row-between">
          <h3 style="margin:0;">Documents</h3>
          <button class="btn btn-primary btn-sm" id="vd-add-btn" style="width:auto;padding:8px 14px;">+ Add</button>
        </div>
        <div id="vd-doc-list" class="mt-8"></div>
      </div>
    </div>
  </div>

  <input type="file" id="vd-file-input" multiple style="display:none;" accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx,.pptx">

  <script src="script.js"></script>
  <script src="vault-detail.js"></script>
</body>
</html>
