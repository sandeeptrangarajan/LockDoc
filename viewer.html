<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Document Viewer — LockDoc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/viewer.css">
</head>
<body>
<div class="app viewer-app" id="viewer-root">

  <div class="viewer-topbar">
    <button class="close-btn" id="close-viewer-btn" aria-label="Close Viewer"><span class="i" id="close-icon">✕</span></button>
    <div class="flex-1 topbar-meta" style="min-width:0;">
      <h1 class="font-extrabold text-15 text-white" id="viewer-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Secure Document Surface</h1>
      <p class="text-xs text-muted" id="viewer-subtitle">Verified Document Release</p>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
      <span class="badge badge-primary font-mono text-xs" id="mode-badge">
        <span id="mode-badge-text">⏱ 60s</span>
      </span>
      <a href="#" id="viewer-direct-link" target="_blank" rel="noopener" class="btn btn-outline btn-sm" style="display:none;padding:6px 12px;font-size:12px;color:#00F0FF;border-color:rgba(0,240,255,0.4);">Open Full ↗</a>
    </div>
  </div>

  <div class="viewer-stage" id="doc-stage" style="margin:0;border-radius:0;border:none;flex:1;height:calc(100vh - 65px);">
    <div class="viewer-locked-overlay hidden" id="locked-overlay">
      <div class="locked-icon-wrap">
        <span class="icon-32" id="locked-icon">🔒</span>
      </div>
      <h3 class="text-18 font-extrabold text-white" id="locked-title">Access Restricted</h3>
      <p id="locked-message">Session expired, invalid token, or document unavailable.</p>
      <a href="index.html" class="btn btn-primary mt-4" style="width:auto;padding:10px 24px;">Return to Dashboard</a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/blockchain.js"></script>
<script src="js/app.js"></script>
<script src="js/emailjs.js"></script>
<script src="js/connection.js"></script>
<script src="js/viewer.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async function(){
  if (window.LD && LD.icons) {
    document.getElementById('close-icon').innerHTML = LD.icons.x || '✕';
    document.getElementById('locked-icon').innerHTML = LD.icons.lock || '🔒';
  }

  var ok = await LD.viewer.init();
  if(!ok) return;

  var docRequest = LD.viewer.docRequest;
  var session = LD.viewer.session;
  var doc = LD.viewer.doc;
  var isOwner = LD.viewer.isOwnerMode;

  if (isOwner) {
    document.getElementById('viewer-title').textContent = doc ? doc.name : 'Document Inspection';
    document.getElementById('viewer-subtitle').textContent = 'Vault Owner Inspection Mode';
  } else if (session) {
    if (doc) {
      document.getElementById('viewer-title').textContent = doc.name;
    }
    document.getElementById('viewer-subtitle').textContent = 'Authorized release by ' + (session.ownerName || 'Vault Owner');
  }

  LD.viewer.renderStage();
  LD.viewer.applyGuards(document.getElementById('viewer-root'));

  LD.viewer.startCountdown(function(){
    if (docRequest && docRequest.requestId) {
      LD.data.updateDocumentRequest(docRequest.requestId, {
        accessToken: null,
        accessExpiresAt: null,
        status: 'expired'
      });
      LD.ui.toast('Viewing session completed for security', 'info');
    }
    setTimeout(function(){ window.location.href = 'index.html'; }, 1000);
  });

  document.getElementById('close-viewer-btn').addEventListener('click', function(){
    LD.viewer.stop();
    window.location.href = 'index.html';
  });

  window.addEventListener('beforeunload', LD.viewer.stop);
});
</script>
</body>
</html>
